name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The Vite configs read PORT and BASE_PATH and fail without them.
      PORT: 3000
      BASE_PATH: /
      # Throwaway database for the integration tests. They truncate tables, and the harness
      # refuses to run against any host that is not local — see src/test/db.ts.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/antropic_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: antropic_test
        ports:
          - 5432:5432
        # Without this the first migration can land before Postgres is accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # Unit tests first: they need no database and fail fastest. Recursive rather than
      # filtered to api-server, so the brand guard in lib/brand (which fails when brand
      # identity is written back into a component) is a blocking gate too.
      - name: Unit tests
        run: pnpm run test

      # The test database is built by replaying the committed migrations, not by diffing the
      # schema. That makes CI exercise the exact path a real deployment takes: if a migration
      # is missing, malformed, or out of order, the integration tests below fail here rather
      # than in production.
      - name: Apply migrations to the test database
        run: pnpm --filter @workspace/db run migrate

      - name: Integration tests
        run: pnpm --filter @workspace/api-server run test:integration

      - run: pnpm run build
