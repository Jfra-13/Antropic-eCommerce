<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The backoffice must never be indexed. This stays a literal rather than brand
         configuration: it is a security property of the panel, not a matter of identity. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Title, description, icons and the manifest are injected by brandHtmlPlugin (lib/brand). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
